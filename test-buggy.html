<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>버그 데모 — 주문 관리</title>
<style>
  body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;margin:0;color:#1a1d26;background:#f5f6f8}
  header{background:#1f2937;color:#fff;padding:14px 28px;display:flex;gap:18px;align-items:center}
  header b{font-size:16px} header a{color:#cbd5e1;text-decoration:none;font-size:14px}
  main{max-width:820px;margin:24px auto;padding:0 20px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:#374151}
  button,a.btn,.fake{font:inherit;font-size:14px;padding:8px 14px;margin:0 6px 8px 0;border:1px solid #d6dae2;background:#fff;border-radius:7px;cursor:pointer;display:inline-block;text-decoration:none;color:inherit}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:13.5px} td,th{padding:8px;border-bottom:1px solid #eef0f3;text-align:left}
  #toast{margin-top:10px;padding:10px 12px;background:#ecfdf5;border-radius:8px;font-size:13.5px;min-height:20px}
  #cartCount{font-weight:700}
</style>
</head>
<body>
<!--
  수동·회귀 확인용 "버그투성이" 데모 사이트 (1/2).
  각 요소의 data-expect 는 ER 이 내려야 할 판정이다 — 결과와 비교해 오탐·미탐을 찾는다.
-->
<header>
  <b>🛒 데모몰 관리자</b>
  <a class="btn" id="toMembers" href="/test-buggy-2.html" data-expect="PASS" style="color:#fff;border-color:#4b5563;background:transparent">회원 설정으로</a>
  <span style="margin-left:auto;font-size:13px">장바구니 <span id="cartCount">0</span></span>
</header>
<main>
  <div class="card">
    <h2>주문 목록</h2>
    <table id="orders">
      <thead><tr><th>주문번호</th><th>상품</th><th>금액</th></tr></thead>
      <tbody><tr><td>#1042</td><td>무선 이어폰</td><td>89,000원</td></tr></tbody>
    </table>
    <div style="margin-top:12px">
      <button id="reload" data-expect="PASS" onclick="addRow()">목록 새로고침</button>
      <button id="sort" data-expect="NO-RESPONSE" onclick="window.__sort='desc'">금액순 정렬</button>
      <button id="filter" data-expect="NO-RESPONSE">필터 초기화</button>
      <button id="more" data-expect="ERROR" onclick="loadMore()">더 불러오기</button>
    </div>
  </div>

  <div class="card">
    <h2>장바구니 · 결제</h2>
    <button id="cart" class="primary" data-expect="ERROR" onclick="addCart()">장바구니 담기</button>
    <button id="coupon" data-expect="ERROR" onclick="fetch('/api/_test/coupon-missing')">쿠폰 적용</button>
    <button id="pay" data-expect="ERROR" onclick="setTimeout(()=>fetch('/api/_test/500'),600)">카드 목록 조회</button>
    <button id="ship" data-expect="ERROR" onclick="trackShipping()">배송 조회</button>
    <button id="review" data-expect="ERROR" onclick="saveReview()">리뷰 저장</button>
    <button id="offline" data-expect="ERROR" onclick="fetch(location.origin + '/api/_test/drop').catch(()=>{})">재고 동기화</button>
    <div id="toast"></div>
  </div>

  <div class="card">
    <h2>기타</h2>
    <button id="modalBtn" data-expect="PASS" onclick="document.getElementById('dlg').showModal()">영수증 보기</button>
    <button id="noticeBtn" data-expect="PASS" onclick="document.getElementById('notice').style.display='flex'">공지 팝업</button>
    <button id="alertBtn" data-expect="PASS" data-reason="알림창" onclick="alert('저장되었습니다')">임시 저장 (alert 로만 알림)</button>
    <button id="confirmBtn" data-expect="PASS" data-reason="알림창" onclick="if (confirm('정말 초기화할까요?')) toast('초기화했습니다')">설정 초기화 (confirm)</button>
    <span class="fake" id="fakeBtn" role="button" tabindex="0" data-expect="NO-RESPONSE">엑셀 내보내기</span>
    <!-- 공지 팝업이 Esc 로 안 닫혀 이 앞에서 화면을 다시 연다 — 그때 화면을 그리며 부르는 목록 요청을 소음으로 배우면 안 된다 -->
    <button id="refetch" data-expect="PASS" data-reason="NET" onclick="fetch('/api/_test/list')">목록 다시 받기 (화면은 그대로)</button>
  </div>
</main>

<dialog id="dlg"><p>영수증 #1042 — 89,000원</p><button id="dlgClose" data-expect="PASS" onclick="this.closest('dialog').close()">닫기</button></dialog>

<!-- 버그: 직접 만든 팝업인데 확인 버튼이 연결돼 있지 않고 Esc 로도 닫히지 않는다 -->
<div id="notice" role="dialog" aria-modal="true"
  style="position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:10px;padding:22px 26px;min-width:280px">
    <p style="margin:0 0 14px">[공지] 9월 정기 점검 안내</p>
    <button id="noticeOk" data-expect="NO-RESPONSE">확인</button>
  </div>
</div>

<script>
  const toast = t => document.getElementById('toast').textContent = t;
  // 화면을 열고 조금 뒤에 목록을 받아 온다(SPA 처럼). 화면을 다시 열 때마다 다시 불린다 —
  // 이걸 배경 소음으로 배워 버리면 같은 요청을 부르는 "목록 다시 받기" 가 무감으로 잘못 잡힌다.
  setTimeout(() => fetch('/api/_test/list'), 1200);
  let n = 1043;
  function addRow() {
    document.querySelector('#orders tbody').insertAdjacentHTML('beforeend',
      `<tr><td>#${n++}</td><td>USB 충전기</td><td>19,000원</td></tr>`);
  }
  // 버그: 응답 형식이 바뀌었는데 예전 필드(items)를 읽는다 — 화면은 안 바뀌고 예외만 난다
  function loadMore() {
    fetch('/api/_test/ok').then(r => r.json()).then(d => d.items.forEach(addRow));
  }
  // 버그: 개수는 올라가지만 곧바로 undefined 를 참조해 예외 — 화면 변화가 있어도 ERROR 여야 한다
  function addCart() {
    const c = document.getElementById('cartCount');
    c.textContent = Number(c.textContent) + 1;
    const opt = window.selectedOption;
    toast(opt.name + ' 담김');
  }
  // 버그: 처리하지 않은 Promise 거절
  function trackShipping() {
    toast('배송 조회 중…');
    Promise.reject(new Error('운송장 번호가 없습니다'));
  }
  // 버그: 실패를 사용자에겐 성공처럼 보이고 console.error 로만 남긴다
  function saveReview() {
    toast('리뷰가 저장되었습니다');
    console.error('[review] 저장 실패: 필수값 rating 누락');
  }
</script>
</body>
</html>
